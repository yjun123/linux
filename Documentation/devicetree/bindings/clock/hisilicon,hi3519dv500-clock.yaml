%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/hisilicon,hi3519dv500-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Hisilicon SOC Clock for HI3519DV500

maintainers:
  - Dongjiu Geng <gengdongjiu@huawei.com>

description: |
  Hisilicon SOC clock control module which supports the clocks and
  resets on HI3519DV500.

  See also:
    dt-bindings/clock/hi3519dv500-clock.h

properties:
  compatible:
    oneOf:
      - const: hisilicon,hi3519dv500-clock
      - items:
          - const: hisilicon,hi3519dv500-clock
          - const: syscon

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 2
    description: |
      First cell is reset request register offset.
      Second cell is bit offset in reset request register.

required:
  - compatible
  - reg
  - '#clock-cells'
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    clock-controller@11010000 {
        compatible = "hisilicon,hi3519dv500-clock";
        #clock-cells = <1>;
        #reset-cells = <2>;
        reg = <0x11010000 0x44a0>;
    };
...
