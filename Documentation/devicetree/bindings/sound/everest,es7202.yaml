%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/everest,es7202.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Everest ES7202 2 channel PDM analog to digital converter

maintainers:
  - Jun Yan <jerrysteve1101@gmail.com>

properties:
  compatible:
    enum:
      - everest,es7202

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description: GPIO connected to the reset pin (active high)

  power-supply:
    description: |
      Main supply (AVDD/DVDD). Optional; when omitted the driver assumes
      3.3 V. The supply voltage selects the analog front-end configuration
      (1.8 V vs 3.3 V).

  "#sound-dai-cells":
    const: 0

required:
  - compatible
  - reg
  - "#sound-dai-cells"

allOf:
  - $ref: dai-common.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        es7202: codec@30 {
            compatible = "everest,es7202";
            reg = <0x30>;
            #sound-dai-cells = <0>;
            reset-gpios = <&gpio0 0 GPIO_ACTIVE_HIGH>;
            power-supply = <&vcc3v3_sys>;
        };
    };
...
