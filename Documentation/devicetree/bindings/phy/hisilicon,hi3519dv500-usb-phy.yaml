%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/hisilicon,hi3519dv500-usb-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3519DV500 USB PHY

maintainers:
  - Jun Yan <jerrysteve1101@gmail.com>

description: |
  The Hi3519DV500 provides one USB2 PHY and one USB3 combo PHY for
  the DWC3 USB controller.  The USB2 PHY carries the analog trim
  words from the device tree and from the OTP trim register, while
  the USB3 combo PHY runs a vendor defined eye diagram tuning
  sequence.  Both PHYs are powered through the CRG controller
  clock that also gates the PHY reset lines.

properties:
  compatible:
    enum:
      - hisilicon,hi3519dv500-usb2-phy
      - hisilicon,hi3519dv500-usb3-phy

  reg:
    minItems: 1
    maxItems: 2
    description: |
      The first region is the PHY register set.  The USB2 PHY has a
      second region for the OTP trim word register.

  reg-names:
    items:
      - const: phy
      - const: trim-otp

  clocks:
    items:
      - description: PHY clock from the CRG controller, which also
          gates the PHY reset lines

  hisilicon,u2phy-trim:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 2
    maxItems: 2
    description: |
      Two analog trim words for the USB2 PHY, written to the
      ANA_CFG0 and ANA_CFG2 registers before the reset line is
      released.

  '#phy-cells':
    const: 0

required:
  - compatible
  - reg
  - clocks
  - '#phy-cells'

if:
  properties:
    compatible:
      contains:
        const: hisilicon,hi3519dv500-usb2-phy

then:
  properties:
    reg:
      minItems: 2
      maxItems: 2
  required:
    - reg-names
    - hisilicon,u2phy-trim

else:
  properties:
    reg:
      maxItems: 1

unevaluatedProperties: false

examples:
  - |
    usb2phy: usb2-phy@17350000 {
        compatible = "hisilicon,hi3519dv500-usb2-phy";
        reg = <0x17350000 0x1000>, <0x101e0124 0x4>;
        reg-names = "phy", "trim-otp";
        clocks = <&crg 127>;
        hisilicon,u2phy-trim = <0x0a33c42b 0x0035180f>;
        #phy-cells = <0>;
    };

    usb3phy: usb3-phy@17361000 {
        compatible = "hisilicon,hi3519dv500-usb3-phy";
        reg = <0x17361000 0x1000>;
        clocks = <&crg 129>;
        #phy-cells = <0>;
    };
...